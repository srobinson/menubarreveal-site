# Cloudflare Workers static assets for menubarreveal.com. The site is this repo's files. One small script, worker.mjs,
# answers the home page alone, so that a client asking for Markdown gets index.md there; the files answer every other path.
# No account id or token here: wrangler uses the owner's `wrangler login` or the environment.
# Deploy with `npm run deploy` (tools/deploy.mjs), which checks first; do not call wrangler by hand.
name = "menubarreveal"
compatibility_date = "2026-11-23"
main = "worker.mjs"
# The apex custom domain is this Worker's only host: no workers.dev alias, no preview URLs.
# www.menubarreveal.com is its own Worker (www-redirect/), a 301 to the apex.
workers_dev = false
preview_urls = false
routes = [{ pattern = "menubarreveal.com", custom_domain = true }]

[assets]
# .deploy/ is a copy of this repo's tracked files minus the dev files listed in .assetsignore. tools/deploy.mjs makes
# it for each deploy and removes it after, so wrangler can never pick up node_modules or the tools.
directory = "./.deploy"
# The script reads the files through this binding, and runs first for "/" only: no other path costs a Worker request.
binding = "ASSETS"
run_worker_first = ["/"]
# A missing path gets 404.html with status 404. _redirects turns /index.html into a 301 to /.
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# The preview host: its own Worker on preview.menubarreveal.com. It serves .preview/, a copy of the site that
# tools/deploy.mjs makes with X-Robots-Tag: noindex, nofollow on every response. Neither folder exists between deploys, so
# a stray `wrangler deploy --env preview` fails instead of publishing an indexable copy.
# Every key is set here because wrangler inherits name and routes from the top level when an environment leaves them
# out, and deploys the top level with only a warning when --env names a missing environment. deploy.mjs checks these lines.
[env.preview]
name = "menubarreveal-preview"
workers_dev = false
preview_urls = false
routes = [{ pattern = "preview.menubarreveal.com", custom_domain = true }]
assets = { directory = "./.preview", binding = "ASSETS", run_worker_first = ["/"], not_found_handling = "404-page", html_handling = "auto-trailing-slash" }
